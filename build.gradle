plugins {
    id 'fabric-loom' version '1.7-SNAPSHOT'
    id 'maven-publish'
}

archivesBaseName = project.archives_base_name
version = project.mod_version
group = project.maven_group

repositories {
    mavenLocal()
    maven { url = "https://www.cursemaven.com" }
    maven { url = "https://maven.shedaniel.me/" }
    maven { url = "https://maven.terraformersmc.com/" }
    maven { url = "https://maven.wispforest.io/" }
    maven { url = "https://jitpack.io" }
    maven { url = "https://maven.ladysnake.org/releases" }
    maven { url = "https://maven.cafeteria.dev" }
    maven { url = "https://maven.jamieswhiteshirt.com/libs-release" }
    maven { url = "https://api.modrinth.com/maven/" }
    maven { url = "https://maven.nucleoid.xyz/" }
    maven { url = "https://maven.enjarai.dev/releases" }

    mavenCentral()
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    // Alloy Forgery
    modImplementation("maven.modrinth:alloy-forgery:${project.alloyforgery_version}")

    // OwO
    annotationProcessor modImplementation("io.wispforest:owo-lib:${project.owo_version}")
    include "io.wispforest:owo-sentinel:${project.owo_version}"

    // Isometric Renders + Worldmesher
    modImplementation("maven.modrinth:isometric-renders:${project.isorender_version}")
    modImplementation("io.wispforest:worldmesher:${project.worldmesher_version}")

    // REI + Arch
    modCompileOnly "me.shedaniel:RoughlyEnoughItems-api-fabric:${project.rei_version}"
    modCompileOnly "me.shedaniel:RoughlyEnoughItems-default-plugin-fabric:${project.rei_version}"
    //modRuntimeOnly "me.shedaniel:RoughlyEnoughItems-fabric:${project.rei_version}"
    modCompileOnly "dev.architectury:architectury-fabric:${project.architectury_version}"

    // EMI
    modCompileOnly "dev.emi:emi-fabric:${project.emi_version}:api"
    modLocalRuntime "dev.emi:emi-fabric:${project.emi_version}"

    // ModMenu
    //modApi("com.terraformersmc:modmenu:${project.modmenu_version}")

    // Additional Entity Attributes
    modImplementation include("maven.modrinth:additionalentityattributes:${project.aea_versionite}")

    // Origins compat via Apoli
    // Excludes Daf's libraries from it, as its out of date and produces duplicate transitive dependencies
    modCompileOnly("com.github.apace100:Apoli:${project.apoli_version}") {
        exclude(group: "io.github.apace100")
        exclude(group: "com.github.DaFuqs")
    }
    modCompileOnly("com.github.apace100:Calio:${project.calio_version}") {
        exclude(group: "org.quiltmc.parsers")
    }

    // Common Protection API
    modImplementation include("eu.pb4:common-protection-api:${project.cpa_version}")

    // MM Decorations
    //modRuntimeOnly("nourl:MythicMetalsDecorations:${project.mmdecorations_version}")

    // Cardinal Components
    modImplementation include("org.ladysnake.cardinal-components-api:cardinal-components-base:${project.cca_version}")
    modImplementation include("org.ladysnake.cardinal-components-api:cardinal-components-entity:${project.cca_version}")

    // Explosive Enhancement
    modApi("maven.modrinth:explosive-enhancement:${project.ee_version}")

    // Cicada
    modImplementation "nl.enjarai:cicada-lib:${project.cicada_version}"
}

sourceSets {
    main {
        resources {
            srcDirs += [
                    'src/main/generated'
            ]
        }
    }
}

fabricApi {
    configureDataGeneration {
        // Set the mod ID so that I won't lose the 50/50 to Alloy Frogery, which throws all the data into the bin
        modId = project.archives_base_name
    }
}

loom {
    accessWidenerPath = file("src/main/resources/mythicmetals.accessWidener")
}

java {
    // Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
    withSourcesJar()
}

processResources {
    inputs.property "version", project.version

    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.encoding = "UTF-8"
}

jar {
    from "LICENSE"
}

// configure the maven publication
publishing {
    publications {
        mavenJava(MavenPublication) {
            // add all the jars that should be included when publishing to maven
            artifact(remapJar) {
                builtBy remapJar
            }
            artifact(sourcesJar) {
                builtBy remapSourcesJar
            }
        }
    }
}

allprojects {
    gradle.projectsEvaluated {
        tasks.withType(JavaCompile) {
            options.compilerArgs << "-Xmaxerrs" << "1000"
        }
    }
}