plugins {
    id 'net.fabricmc.fabric-loom' version '1.17-SNAPSHOT'
    id 'maven-publish'
}

archives_base_name = project.archives_base_name
version = project.mod_version
group = project.maven_group

repositories {
    mavenLocal()
    maven { url = "https://www.cursemaven.com" }
    maven { url = "https://maven.shedaniel.me/" }
    maven { url = "https://maven.terraformersmc.com/" }
    maven { url = "https://maven.wispforest.io/" }
    maven { url = "https://jitpack.io" }
    maven { url = "https://maven.ladysnake.org/releases" }
    maven { url = "https://maven.cafeteria.dev" }
    maven { url = "https://maven.jamieswhiteshirt.com/libs-release" }
    maven { url = "https://api.modrinth.com/maven/" }
    maven { url = "https://maven.nucleoid.xyz/" }
    maven { url = "https://maven.enjarai.dev/releases" }

    mavenCentral()
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    // Alloy Forgery
    compileOnly("maven.modrinth:alloy-forgery:${project.alloyforgery_version}")

    // OwO
    annotationProcessor implementation("io.wispforest:owo-lib:${project.owo_version}")
    include "io.wispforest:owo-sentinel:${project.owo_version}"

    // Isometric Renders + Worldmesher
    runtimeOnly compileOnly("maven.modrinth:wikirenderer:${project.wikirender_version}")

    // REI + Arch
    compileOnly "me.shedaniel:RoughlyEnoughItems-api-fabric:${project.rei_version}"
    compileOnly "me.shedaniel:RoughlyEnoughItems-default-plugin-fabric:${project.rei_version}"
    //runtimeOnly "me.shedaniel:RoughlyEnoughItems-fabric:${project.rei_version}"
    compileOnly "dev.architectury:architectury-fabric:${project.architectury_version}"

    // EMI
    compileOnly "dev.emi:emi-fabric:${project.emi_version}:api"
//    modLocalRuntime "dev.emi:emi-fabric:${project.emi_version}"

    // ModMenu
    //modApi("com.terraformersmc:modmenu:${project.modmenu_version}")

    // Additional Entity Attributes
    implementation include("maven.modrinth:additionalentityattributes:${project.aea_versionite}")

    // Origins compat via Apoli
    // Excludes Daf's libraries from it, as its out of date and produces duplicate transitive dependencies
//    compileOnly("com.github.apace100:Apoli:${project.apoli_version}") {
//        exclude(group: "io.github.apace100")
//        exclude(group: "com.github.DaFuqs")
//    }
//    compileOnly("com.github.apace100:Calio:${project.calio_version}") {
//        exclude(group: "org.quiltmc.parsers")
//    }

    // Common Protection API
    implementation include("eu.pb4:common-protection-api:${project.cpa_version}")

    // MM Decorations
    //runtimeOnly("nourl:MythicMetalsDecorations:${project.mmdecorations_version}")

    // Explosive Enhancement
    api("maven.modrinth:explosive-enhancement:${project.ee_version}")

    // Cicada
    implementation "nl.enjarai:cicada-lib:${project.cicada_version}"
}

fabricApi {
    configureDataGeneration {
        // Set the mod ID so that I won't lose the 50/50 to Alloy Frogery, which throws all the data into the bin
        modId = project.archives_base_name
    }
}

loom {
    accessWidenerPath = file("src/main/resources/mythicmetals.accessWidener")
}

java {
    // Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
    withSourcesJar()
}

processResources {
    inputs.property "version", project.version

    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

tasks.withType(JavaCompile).configureEach {
    it.options.encoding = "UTF-8"
}

jar {
    from "LICENSE"
}

// add all the jars that should be included when publishing to maven
publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
        }
    }
}

allprojects {
    gradle.projectsEvaluated {
        tasks.withType(JavaCompile) {
            options.compilerArgs << "-Xmaxerrs" << "1000"
        }
    }
}